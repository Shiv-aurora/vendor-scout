name: One-shot conversation rerender fix

on:
  push:
    branches: ["build/supplier-outreach"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/supplier-outreach
      - name: Preserve conversation ready counter across rerenders
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/app.js')
          text = path.read_text()
          old = '<h2>${qualified.length} qualified supplier${qualified.length === 1 ? "" : "s"} can enter RFQ.</h2>'
          new = '<h2><span id="conversation-ready-count">${qualified.length}</span> qualified supplier${qualified.length === 1 ? "" : "s"} can enter RFQ.</h2>'
          if old not in text:
              raise SystemExit('expected conversation heading not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/one-shot-conversation-counter-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js .github/workflows/one-shot-conversation-counter-fix.yml
          git commit -m "preserve conversation counter across rerenders"
          git push origin HEAD:build/supplier-outreach
