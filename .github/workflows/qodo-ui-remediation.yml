name: Qodo UI Remediation

on:
  push:
    branches: [ui/final-polish]
    paths:
      - .github/qodo-ui-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/final-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Qodo fixes
        run: python scripts/apply_qodo_ui_fixes.py
      - name: Install
        run: npm ci
      - name: Validate full suite
        run: npm run check
      - name: Commit only after validation
        run: |
          git config user.name "vendor-scout-qodo-remediation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_qodo_ui_fixes.py .github/workflows/qodo-ui-remediation.yml .github/qodo-ui-trigger.txt
          git add public/app.js public/app.css test/ui-polish-regressions.test.mjs
          git commit -m "fix Qodo UI correctness findings"
          git push origin HEAD:ui/final-polish
