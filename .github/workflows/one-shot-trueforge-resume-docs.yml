name: One-shot TrueForge resume docs

on:
  push:
    branches: ["build/final-product-copy2"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/update_trueforge_resume_docs.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/update_trueforge_resume_docs.py .github/workflows/one-shot-trueforge-resume-docs.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'document TrueForge approval resume wire contract'
          git push origin HEAD:build/final-product-copy2
