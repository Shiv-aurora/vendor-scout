name: Vendor Scout Decision Browser

on:
  push:
    branches: ["build/final-product-copy2"]
  pull_request:
    paths:
      - "public/**"
      - "lib/approval.mjs"
      - "lib/orders.mjs"
      - "lib/quotes.mjs"
      - "lib/mcp.mjs"
      - "server.mjs"
      - "scripts/demo-decision.mjs"
      - ".github/workflows/decision-browser.yml"

jobs:
  validate-decision-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build approval-ready decision state
        run: |
          export VENDOR_SCOUT_DATA_PATH=/tmp/vendor-scout-decision-browser.json
          export TRUEFORGE_BASE_URL=
          export VENDOR_SCOUT_OUTREACH_URL=
          export VENDOR_SCOUT_ORDER_URL=
          rm -f "$VENDOR_SCOUT_DATA_PATH"
          node server.mjs > /tmp/vendor-scout-decision.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1

          npm run demo:decision -- http://127.0.0.1:3000 > /tmp/demo-decision.json
          grep '"missionStatus": "awaiting_approval"' /tmp/demo-decision.json
          grep '"kind": "order_sample"' /tmp/demo-decision.json

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"

          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1440,1500 --dump-dom 'http://127.0.0.1:3000/#app/approvals' > /tmp/decision-pending.html
          grep '<section class="view active" id="view-approvals">' /tmp/decision-pending.html
          grep 'VENDOR SCOUT RECOMMENDS' /tmp/decision-pending.html
          grep 'Human decision required' /tmp/decision-pending.html
          grep 'Approve sample' /tmp/decision-pending.html
          grep 'Complete landed cost' /tmp/decision-pending.html
          grep 'Deterministic scoring' /tmp/decision-pending.html
          if grep -q 'id="workspace-error"[^>]*>[^<]' /tmp/decision-pending.html; then echo "Workspace error visible"; exit 1; fi
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --window-size=1440,1500 --screenshot=/tmp/decision-pending-desktop.png 'http://127.0.0.1:3000/#app/approvals'
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --window-size=390,844 --screenshot=/tmp/decision-pending-mobile.png 'http://127.0.0.1:3000/#app/approvals'

          curl --fail --silent -X POST -H 'Content-Type: application/json' \
            --data '{"decision":"approve"}' \
            http://127.0.0.1:3000/api/missions/mission-lidar-500/approval > /tmp/approved.json
          grep '"status":"approved"' /tmp/approved.json
          grep '"sampleOrders":\[\]' /tmp/approved.json

          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3000 --window-size=1440,1200 --dump-dom 'http://127.0.0.1:3000/#app/approvals' > /tmp/decision-approved.html
          grep 'Business approval recorded' /tmp/decision-approved.html
          grep 'execution is still gated' /tmp/decision-approved.html
          grep 'vendor_scout_execute_sample_order' /tmp/decision-approved.html
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --window-size=1440,1200 --screenshot=/tmp/decision-approved-desktop.png 'http://127.0.0.1:3000/#app/approvals'

          curl --fail --silent -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":99,"method":"tools/call","params":{"name":"vendor_scout_execute_sample_order","arguments":{"missionId":"mission-lidar-500"}}}' \
            http://127.0.0.1:3000/mcp > /tmp/sample-executed.json
          grep '"status":"completed"' /tmp/sample-executed.json
          grep '"provider":"controlled-sample-order"' /tmp/sample-executed.json
          grep '"simulated":true' /tmp/sample-executed.json

          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3000 --window-size=1440,1200 --dump-dom 'http://127.0.0.1:3000/#app/approvals' > /tmp/decision-completed.html
          grep 'Controlled sample action' /tmp/decision-completed.html
          grep 'no external spend occurred' /tmp/decision-completed.html
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --window-size=1440,1200 --screenshot=/tmp/decision-completed-desktop.png 'http://127.0.0.1:3000/#app/approvals'
      - name: Upload decision browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: vendor-scout-decision-browser
          path: |
            /tmp/decision-pending-desktop.png
            /tmp/decision-pending-mobile.png
            /tmp/decision-approved-desktop.png
            /tmp/decision-completed-desktop.png
            /tmp/decision-pending.html
            /tmp/decision-approved.html
            /tmp/decision-completed.html
            /tmp/demo-decision.json
            /tmp/approved.json
            /tmp/sample-executed.json
