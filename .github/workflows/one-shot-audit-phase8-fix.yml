name: One-shot audited Phase 8 cleanup

on:
  push:
    branches: ["build/quote-comparison"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited Phase 8 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('server.mjs')
          text = server.read_text()
          old = '    offerEvaluations: analysis.offerEvaluations,\n'
          new = '''    offerEvaluations: analysis.offerEvaluations.map(item => ({\n      supplierId: item.supplierId,\n      conversationId: item.conversationId,\n      offerId: item.offerId,\n      evaluation: {\n        offerId: item.evaluation.offerId,\n        supplierId: item.evaluation.supplierId,\n        status: item.evaluation.status,\n        targetCurrency: item.evaluation.targetCurrency,\n        competitorBenchmark: item.evaluation.competitorBenchmark,\n        gaps: item.evaluation.gaps,\n        missingFields: item.evaluation.missingFields\n      }\n    })),\n'''
          if old not in text:
              raise SystemExit('server signature anchor not found')
          server.write_text(text.replace(old, new, 1))

          quotes = Path('lib/quotes.mjs')
          text = quotes.read_text()
          old = '    id: stableId("recommendation", mission.id, winner.id, now.slice(0, 10)),\n'
          new = '    id: stableId("recommendation", mission.id, winner.id),\n'
          if old not in text:
              raise SystemExit('recommendation id anchor not found')
          quotes.write_text(text.replace(old, new, 1))

          Path('.github/workflows/phase8-diagnostic.yml').unlink(missing_ok=True)
          Path('docs/PHASE8_DIAGNOSTIC.txt').unlink(missing_ok=True)
          Path('.github/workflows/one-shot-audit-phase8-fix.yml').unlink(missing_ok=True)
          PY
      - name: Commit audited fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix quote analysis idempotency and remove diagnostics'
          git push origin HEAD:build/quote-comparison
