name: Apply Qodo Review Fixes

on:
  push:
    branches: ["build/final-product-copy2"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/final-product-copy2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed fixes
        run: |
          node scripts/apply-qodo-review-fixes.mjs
          node scripts/fix-qodo-remediation-test.mjs
      - name: Validate before commit
        run: npm run check
      - name: Commit remediation and remove temporary patch machinery
        run: |
          rm scripts/apply-qodo-review-fixes.mjs scripts/fix-qodo-remediation-test.mjs .github/workflows/apply-qodo-review-fixes.yml docs/QODO_REMEDIATION_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix Qodo review findings"
          git push origin HEAD:build/final-product-copy2
