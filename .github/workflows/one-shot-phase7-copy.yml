name: One-shot Phase 7 landing copy

on:
  push:
    branches: ["build/autonomous-negotiation"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/autonomous-negotiation
      - name: Refresh landing copy for autonomous negotiation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          t = p.read_text()
          replacements = {
            'Vendor Scout already implements the persistent TrueForge session and seven-tool MCP boundary; a live external TrueForge runtime is the remaining configuration step.': 'Vendor Scout already implements the persistent TrueForge session and ten-tool sourcing, outreach, and negotiation MCP boundary; a live external TrueForge runtime is the remaining configuration step.',
            'Discovery, qualification, and RFQ outreach now run through one persistent sourcing mission.': 'Discovery, qualification, RFQ outreach, and evidence-backed counter negotiation now run through one persistent sourcing mission.',
            'Qualified suppliers become persistent RFQ threads. Vendor Scout can deliver non-binding RFQs through an idempotent transport, persist replies, and move into negotiation while commitments remain human-gated.': 'Qualified suppliers become persistent RFQ threads. Vendor Scout can deliver non-binding RFQs, persist supplier replies, extract only explicit offer terms, and run retry-safe non-binding counter rounds while commitments remain human-gated.',
            '/procurement.css?v=vendor-scout-4': '/procurement.css?v=vendor-scout-5',
            '/app.js?v=vendor-scout-4': '/app.js?v=vendor-scout-5'
          }
          for old, new in replacements.items():
              if old not in t:
                  raise SystemExit(f'expected copy not found: {old[:100]}')
              t = t.replace(old, new, 1)
          p.write_text(t)
          Path('.github/workflows/one-shot-phase7-copy.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html .github/workflows/one-shot-phase7-copy.yml
          git commit -m "refresh landing copy for autonomous negotiation"
          git push origin HEAD:build/autonomous-negotiation
