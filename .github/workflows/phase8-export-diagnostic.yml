name: Export Phase 8 Runtime Diagnostic

on:
  push:
    branches: ["build/quote-comparison"]

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/quote-comparison
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture focused test output
        run: |
          set +e
          node --test test/quote-runtime.test.mjs > docs/PHASE8_DIAGNOSTIC.txt 2>&1
          exit 0
      - name: Commit diagnostic and remove exporter
        run: |
          rm .github/workflows/phase8-export-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE8_DIAGNOSTIC.txt .github/workflows/phase8-export-diagnostic.yml
          git commit -m "export Phase 8 runtime diagnostic"
          git push origin HEAD:build/quote-comparison
