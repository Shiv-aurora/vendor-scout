name: One-shot Phase 7 negotiation UI

on:
  push:
    branches: ["build/autonomous-negotiation"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/autonomous-negotiation
      - name: Render negotiation evidence in Conversations
        run: python scripts/phase7_ui_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/procurement.css .github/workflows/one-shot-phase7-ui.yml scripts/phase7_ui_patch.py
          git commit -m "render evidence-backed negotiation state"
          git push origin HEAD:build/autonomous-negotiation
