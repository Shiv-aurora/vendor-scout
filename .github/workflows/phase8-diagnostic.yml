name: Phase 8 Quote Runtime Diagnostic

on:
  push:
    branches: ["build/quote-comparison"]

jobs:
  quote-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/quote-runtime.test.mjs
