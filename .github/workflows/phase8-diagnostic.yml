name: Phase 8 Quote Runtime Diagnostic

on:
  push:
    branches: ["build/quote-comparison"]

jobs:
  quote-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run focused quote runtime tests
        id: tests
        shell: bash
        run: |
          set +e
          node --test test/quote-runtime.test.mjs > /tmp/quote-runtime.log 2>&1
          STATUS=$?
          cat /tmp/quote-runtime.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-quote-runtime-diagnostic
          path: /tmp/quote-runtime.log
      - name: Preserve test result
        if: always()
        run: exit "${{ steps.tests.outputs.status }}"
