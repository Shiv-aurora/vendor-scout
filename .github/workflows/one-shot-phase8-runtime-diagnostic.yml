name: One-shot Phase 8 runtime diagnostic

on:
  push:
    branches: ["build/quote-comparison"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/quote-comparison
      - run: python scripts/phase8_runtime_diagnostic_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/quote-runtime.test.mjs .github/workflows/one-shot-phase8-runtime-diagnostic.yml scripts/phase8_runtime_diagnostic_patch.py
          git commit -m "surface quote analysis blockers in runtime test"
          git push origin HEAD:build/quote-comparison
