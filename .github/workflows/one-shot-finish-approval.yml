name: One-shot finish approval and sample execution

on:
  push:
    branches: ["build/final-product-copy2"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire approval and sample execution
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('server.mjs')
          text = server.read_text()
          text = text.replace('import { analyzeQuotes as computeQuoteAnalysis } from "./lib/quotes.mjs";\n', 'import { analyzeQuotes as computeQuoteAnalysis } from "./lib/quotes.mjs";\nimport { applyApprovalDecision, buildApprovalPacket } from "./lib/approval.mjs";\nimport { createSampleOrder, submitSampleOrder } from "./lib/orders.mjs";\n', 1)
          text = text.replace('const allowOutreachPreview = !isProduction || process.env.VENDOR_SCOUT_ALLOW_OUTREACH_PREVIEW === "1";\n', 'const allowOutreachPreview = !isProduction || process.env.VENDOR_SCOUT_ALLOW_OUTREACH_PREVIEW === "1";\nconst allowOrderPreview = !isProduction || process.env.VENDOR_SCOUT_ALLOW_ORDER_PREVIEW === "1";\n', 1)
          text = text.replace('    outreach: {\n      provider: process.env.VENDOR_SCOUT_OUTREACH_URL ? "remote" : allowOutreachPreview ? "controlled-preview" : "unconfigured",\n      previewEnabled: allowOutreachPreview\n    },\n', '    outreach: {\n      provider: process.env.VENDOR_SCOUT_OUTREACH_URL ? "remote" : allowOutreachPreview ? "controlled-preview" : "unconfigured",\n      previewEnabled: allowOutreachPreview\n    },\n    sampleOrders: {\n      provider: process.env.VENDOR_SCOUT_ORDER_URL ? "remote" : allowOrderPreview ? "controlled-preview" : "unconfigured",\n      previewEnabled: allowOrderPreview\n    },\n', 1)
          text = text.replace('      approvalsWaiting,\n      projectedSavings\n', '      approvalsWaiting,\n      sampleOrders: state.sampleOrders.length,\n      projectedSavings\n', 1)
          text = text.replace('    approvals: forMission(state.approvals),\n    activity: forMission(state.activity)\n', '    approvals: forMission(state.approvals),\n    sampleOrders: forMission(state.sampleOrders),\n    activity: forMission(state.activity)\n', 1)

          anchor = 'async function analyzeMissionQuotes(missionId, fxRates = []) {'
          helpers = r'''function approvalForMission(missionId) {
  return [...state.approvals].reverse().find(item => item.missionId === missionId) || null;
}

function prepareMissionApproval(mission, analysis) {
  if (!analysis.recommendation) return null;
  const quote = analysis.quotes.find(item => item.id === analysis.recommendation.quoteId);
  const supplier = state.supplierCandidates.find(item => item.id === analysis.recommendation.supplierId && item.missionId === mission.id);
  if (!quote || !supplier) throw httpError(500, "Recommendation evidence is incomplete");
  const packet = buildApprovalPacket(mission, analysis.recommendation, quote, supplier, analysis.quotes);
  const existing = state.approvals.find(item => item.id === packet.id);
  if (existing?.status && existing.status !== "pending") return existing;
  state.approvals = [...state.approvals.filter(item => item.missionId !== mission.id || item.status !== "pending"), packet];
  if (mission.status === "comparing") mission.status = transitionMission(mission.status, "analysis_complete");
  mission.updatedAt = packet.createdAt;
  addActivity(mission.id, "approval", `Approval requested for ${packet.supplierName}`, `${packet.packet.proposed.unitPriceBase == null ? "Price normalized with remaining uncertainty" : `${packet.packet.proposed.unitPriceBase.toFixed(2)} ${packet.packet.currentSupplier.currency} / unit`} · human decision required before ${packet.action.kind === "order_sample" ? "sample procurement" : "supplier progression"}.`);
  return packet;
}

async function decideMissionApproval(missionId, decision) {
  const mission = state.missions.find(item => item.id === missionId);
  if (!mission) throw httpError(404, "Sourcing mission not found");
  requireStatus(mission, "awaiting_approval", "record human approval decision");
  const approval = state.approvals.find(item => item.missionId === missionId && item.status === "pending");
  if (!approval) throw httpError(409, "No pending approval exists for this mission");
  applyApprovalDecision(approval, decision);
  if (decision === "approve") mission.status = transitionMission(mission.status, "approve");
  else if (decision === "reject") mission.status = transitionMission(mission.status, "reject");
  else mission.status = transitionMission(mission.status, "negotiate_more");
  mission.updatedAt = approval.decidedAt;
  mission.execution = {
    ...(mission.execution || {}),
    humanDecision: decision,
    humanDecisionAt: approval.decidedAt,
    approvalId: approval.id
  };
  addActivity(missionId, "approval", decision === "approve" ? "Human approved the recommended next action" : decision === "reject" ? "Human rejected the recommendation" : "Human requested more negotiation", decision === "approve" ? "The mission is approved, but the sample action has not executed yet. TrueForge must still cross its configured approval-gated execution tool." : decision === "reject" ? "No commercial commitment or sample order was executed." : "The mission returned to negotiation without accepting terms or spending money.");
  await persist();
  return missionSnapshot(missionId);
}

async function executeApprovedSampleOrder(missionId) {
  const mission = state.missions.find(item => item.id === missionId);
  if (!mission) throw httpError(404, "Sourcing mission not found");
  requireStatus(mission, "approved", "execute approved sample action");
  const approval = [...state.approvals].reverse().find(item => item.missionId === missionId && item.status === "approved");
  if (!approval) throw httpError(409, "No approved human decision exists for this mission");
  if (approval.action?.kind !== "order_sample") throw httpError(409, "The approved recommendation does not contain an orderable sample action");
  const quote = state.quotes.find(item => item.id === approval.quoteId && item.missionId === missionId);
  if (!quote) throw httpError(409, "Approved quote is no longer available");

  let order = state.sampleOrders.find(item => item.missionId === missionId && item.approvalId === approval.id);
  if (!order) {
    order = createSampleOrder(mission, approval, quote);
    state.sampleOrders.push(order);
    await persist();
  }
  if (["submitted", "simulated"].includes(order.status)) return missionSnapshot(missionId);

  order.status = "submitting";
  order.error = null;
  await persist();
  try {
    const result = await submitSampleOrder(order, { allowControlledPreview: allowOrderPreview });
    order.status = result.status;
    order.provider = result.provider;
    order.simulated = result.simulated;
    order.externalOrderId = result.externalOrderId;
    order.submittedAt = result.submittedAt;
    order.completedAt = new Date().toISOString();
    mission.status = transitionMission(mission.status, "action_complete");
    mission.updatedAt = order.completedAt;
    addActivity(missionId, "approved_action", result.simulated ? `Controlled sample order recorded for ${order.supplierName}` : `Sample order submitted to ${order.supplierName}`, result.simulated ? `${order.quantity} sample unit · ${order.currency} ${order.totalBase.toFixed(2)} · controlled simulation only, no external spend occurred.` : `${order.quantity} sample unit · ${order.currency} ${order.totalBase.toFixed(2)} · provider order ${order.externalOrderId}.`);
  } catch (error) {
    order.status = "failed";
    order.error = String(error.message || error).slice(0, 2000);
    addActivity(missionId, "approved_action", `Sample order failed for ${order.supplierName}`, order.error);
    await persist();
    throw error;
  }
  await persist();
  return missionSnapshot(missionId);
}

'''
          if helpers not in text:
              if anchor not in text: raise SystemExit('analysis anchor not found')
              text = text.replace(anchor, helpers + anchor, 1)

          old = '''  if (analysis.recommendation && mission.status === "negotiating") {
    mission.status = transitionMission(mission.status, "negotiation_complete");
  }
  mission.updatedAt = new Date().toISOString();
'''
          new = '''  if (analysis.recommendation && mission.status === "negotiating") {
    mission.status = transitionMission(mission.status, "negotiation_complete");
  }
  if (analysis.recommendation) prepareMissionApproval(mission, analysis);
  mission.updatedAt = new Date().toISOString();
'''
          if old not in text: raise SystemExit('analysis transition anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace('async function mcpAnalyzeQuotes(id, fxRates) {\n  return serializeMutation(() => analyzeMissionQuotes(id, fxRates));\n}\n', 'async function mcpAnalyzeQuotes(id, fxRates) {\n  return serializeMutation(() => analyzeMissionQuotes(id, fxRates));\n}\n\nasync function mcpExecuteSampleOrder(id) {\n  return serializeMutation(() => executeApprovedSampleOrder(id));\n}\n', 1)
          text = text.replace('  sendCounter: mcpSendCounter,\n  analyzeQuotes: mcpAnalyzeQuotes\n', '  sendCounter: mcpSendCounter,\n  analyzeQuotes: mcpAnalyzeQuotes,\n  executeSampleOrder: mcpExecuteSampleOrder\n', 1)

          route_anchor = '    const missionMatch = url.pathname.match(/^\\/api\\/missions\\/([^/]+)$/);\n'
          approval_route = r'''    const approvalMatch = url.pathname.match(/^\/api\/missions\/([^/]+)\/approval$/);
    if (approvalMatch && req.method === "POST") {
      if (!isAgentAuthorized(req)) return json(res, configuredAgentToken ? 401 : 503, { error: configuredAgentToken ? "Agent authorization required" : "Agent mutation API is disabled until VENDOR_SCOUT_AGENT_TOKEN is configured" });
      const missionId = decodeURIComponent(approvalMatch[1]);
      const body = await readJsonBody(req);
      const snapshot = await serializeMutation(() => decideMissionApproval(missionId, body.decision));
      return json(res, 200, snapshot);
    }

'''
          if approval_route not in text:
              if route_anchor not in text: raise SystemExit('mission route anchor not found')
              text = text.replace(route_anchor, approval_route + route_anchor, 1)
          server.write_text(text)

          mcp = Path('lib/mcp.mjs')
          text = mcp.read_text()
          text = text.replace('const MCP_SERVER_INFO = Object.freeze({ name: "vendor-scout", version: "0.6.0" });', 'const MCP_SERVER_INFO = Object.freeze({ name: "vendor-scout", version: "0.8.0" });', 1)
          text = text.replace('const annotations = (readOnly, openWorld) => ({ readOnlyHint: readOnly, destructiveHint: false, idempotentHint: true, openWorldHint: openWorld });', 'const annotations = (readOnly, openWorld, destructive = false) => ({ readOnlyHint: readOnly, destructiveHint: destructive, idempotentHint: true, openWorldHint: openWorld });', 1)
          tool_anchor = '  { name: "vendor_scout_analyze_quotes", title: "Normalize and compare supplier quotes", description: "Deterministically normalize offers into comparable quote records, apply explicitly supplied provenance-backed FX rates, calculate known/landed costs and savings, score/rank eligible offers, and persist a human-approval-required recommendation. Missing shipping or FX stays visible; this tool never accepts terms or places an order.", inputSchema: { type: "object", properties: { missionId: { type: "string", minLength: 1 }, fxRates: { type: "array", maxItems: 30, items: fxRateSchema } }, required: ["missionId"], additionalProperties: false }, annotations: annotations(false, false) }\n]);'
          tool_new = '  { name: "vendor_scout_analyze_quotes", title: "Normalize and compare supplier quotes", description: "Deterministically normalize offers into comparable quote records, apply explicitly supplied provenance-backed FX rates, calculate known/landed costs and savings, score/rank eligible offers, and persist a human-approval-required recommendation. Missing shipping or FX stays visible; this tool never accepts terms or places an order.", inputSchema: { type: "object", properties: { missionId: { type: "string", minLength: 1 }, fxRates: { type: "array", maxItems: 30, items: fxRateSchema } }, required: ["missionId"], additionalProperties: false }, annotations: annotations(false, false) },\n  { name: "vendor_scout_execute_sample_order", title: "Execute approved sample order", description: "Execute the already human-approved sample action. The mission must already contain a matching approved decision. This tool can create external spend when a live order provider is configured and MUST be human-approved in TrueForge before execution.", inputSchema: missionOnly, annotations: annotations(false, true, true) }\n]);'
          if tool_anchor not in text: raise SystemExit('MCP tool anchor not found')
          text = text.replace(tool_anchor, tool_new, 1)
          call_anchor = '    if (name === "vendor_scout_analyze_quotes") return rpcResult(message.id, toolResult(await context.analyzeQuotes(missionId, Array.isArray(args.fxRates) ? args.fxRates : []), "Quote comparison result:"));\n'
          call_new = call_anchor + '    if (name === "vendor_scout_execute_sample_order") return rpcResult(message.id, toolResult(await context.executeSampleOrder(missionId), "Approved sample-order result:"));\n'
          if call_anchor not in text: raise SystemExit('MCP call anchor not found')
          text = text.replace(call_anchor, call_new, 1)
          text = text.replace('Quote analysis may recommend but cannot accept commercial terms, spend money, order samples, or place an order; those commitments remain human-gated and are not exposed by these tools.', 'Quote analysis may recommend and create a pending approval packet. The sample-order execution tool is destructive and must be configured for TrueForge human approval; Vendor Scout additionally requires a persisted approved decision before it can execute.', 1)
          mcp.write_text(text)

          migrations = Path('lib/migrations.mjs')
          text = migrations.read_text()
          text = text.replace('export const CURRENT_CONTRACT_VERSION = "2.4.0";', 'export const CURRENT_CONTRACT_VERSION = "2.5.0";', 1)
          text = text.replace('["2.0.0", "2.1.0", "2.2.0", "2.3.0"].includes(version)', '["2.0.0", "2.1.0", "2.2.0", "2.3.0", "2.4.0"].includes(version)', 1)
          migrations.write_text(text)

          trueforge = Path('lib/trueforge.mjs')
          text = trueforge.read_text()
          old = '    "If the latest offer is marked ready_for_comparison, stop countering that supplier; this does not accept the offer. If Vendor Scout marks human_review/reject_recommended because of an explicit critical technical conflict, stop autonomous negotiation and surface the issue.",\n'
          new = old + '    "When one or more offers are ready for comparison, use the TrueForge sandbox to independently recompute the core quote math from persisted terms (quantity tiers, MOQ, shipping, FX when supplied, and baseline savings) so arithmetic is inspectable. Then call vendor_scout_analyze_quotes to persist the deterministic normalized comparison. Do not fabricate FX or shipping inputs.",\n    "vendor_scout_analyze_quotes creates the pending decision packet and moves a successful comparison to awaiting_approval. When the mission is awaiting_approval, stop and surface the decision; do not try to bypass the human business decision.",\n    "If a later turn sees the mission status approved, call vendor_scout_execute_sample_order only for the approved action. That tool is destructive and must be listed in TrueForge require_approval_for_tools, so the harness pauses again immediately before execution. Never work around or disable that gate.",\n'
          if old not in text: raise SystemExit('TrueForge prompt anchor not found')
          trueforge.write_text(text.replace(old, new, 1))
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm --cached .github/workflows/one-shot-finish-approval.yml >/dev/null 2>&1 || true
          rm -f .github/workflows/one-shot-finish-approval.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'add human approval and approval-gated sample execution'
          git push origin HEAD:build/final-product-copy2
