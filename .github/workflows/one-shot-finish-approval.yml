name: One-shot finish approval and sample execution

on:
  push:
    branches: ["build/final-product-copy2"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approval integration
        run: python scripts/finish_approval_patch.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/finish_approval_patch.py .github/workflows/one-shot-finish-approval.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'add human approval and approval-gated sample execution'
          git push origin HEAD:build/final-product-copy2
