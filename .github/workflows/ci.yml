name: Vendor Scout CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Runtime and browser smoke tests
        run: |
          export VENDOR_SCOUT_DATA_PATH=/tmp/vendor-scout-ci.json
          export VENDOR_SCOUT_SEED_MODE=approval-ready
          rm -f "$VENDOR_SCOUT_DATA_PATH"
          node server.mjs > /tmp/vendor-scout.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1

          curl --fail --silent http://127.0.0.1:3000/health | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:3000/api/dashboard | grep '"seedMode":"approval-ready"'

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"

          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=2500 --window-size=1440,1100 --dump-dom 'http://127.0.0.1:3000/#app' > /tmp/vendor-scout-desktop.html
          grep '<section class="view active" id="view-overview">' /tmp/vendor-scout-desktop.html
          grep '<h1 id="page-title">Overview</h1>' /tmp/vendor-scout-desktop.html
          grep 'data-view="missions"' /tmp/vendor-scout-desktop.html
          grep 'data-view="suppliers"' /tmp/vendor-scout-desktop.html
          grep 'data-view="conversations"' /tmp/vendor-scout-desktop.html
          grep 'data-view="approvals"' /tmp/vendor-scout-desktop.html
          grep 'Waiting for approval' /tmp/vendor-scout-desktop.html
          grep 'ScanWorks Taiwan is recommended' /tmp/vendor-scout-desktop.html
          if grep -q 'id="workspace-error"[^>]*>[^<]' /tmp/vendor-scout-desktop.html; then
            echo "Workspace error is visible"
            exit 1
          fi

          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=2500 --window-size=390,844 --dump-dom 'http://127.0.0.1:3000/#app' > /tmp/vendor-scout-mobile.html
          grep '<span class="nav-label">Suppliers</span>' /tmp/vendor-scout-mobile.html
          grep '<span class="nav-label">Negotiations</span>' /tmp/vendor-scout-mobile.html
          grep '<span class="nav-label">Approvals</span>' /tmp/vendor-scout-mobile.html
          if grep -q 'id="workspace-error"[^>]*>[^<]' /tmp/vendor-scout-mobile.html; then
            echo "Workspace error is visible on mobile"
            exit 1
          fi

          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=2500 --window-size=1440,1100 --screenshot=/tmp/vendor-scout-desktop.png 'http://127.0.0.1:3000/#app'
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=2500 --window-size=390,844 --screenshot=/tmp/vendor-scout-mobile.png 'http://127.0.0.1:3000/#app'
      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: vendor-scout-browser-smoke
          path: |
            /tmp/vendor-scout-desktop.png
            /tmp/vendor-scout-mobile.png
            /tmp/vendor-scout-desktop.html
            /tmp/vendor-scout-mobile.html
