name: Vendor Scout Outreach Browser

on:
  push:
    branches: ["build/supplier-outreach"]
  pull_request:
    paths:
      - "public/**"
      - "lib/outreach.mjs"
      - "server.mjs"
      - ".github/workflows/outreach-browser.yml"

jobs:
  validate-outreach-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Render controlled outreach conversation
        run: |
          export VENDOR_SCOUT_DATA_PATH=/tmp/vendor-scout-outreach-browser.json
          export TRUEFORGE_BASE_URL=
          rm -f "$VENDOR_SCOUT_DATA_PATH"
          node server.mjs > /tmp/vendor-scout-outreach.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1

          curl --fail --silent -X POST \
            -H 'Content-Type: application/json' \
            --data '{"action":"prepare_outreach"}' \
            http://127.0.0.1:3000/api/missions/mission-lidar-500/actions > /tmp/prepare.json

          curl --fail --silent -X POST \
            -H 'Content-Type: application/json' \
            --data '{"action":"send_outreach"}' \
            http://127.0.0.1:3000/api/missions/mission-lidar-500/actions > /tmp/preview.json

          grep '"status":"contacting"' /tmp/preview.json
          grep '"provider":"controlled-preview"' /tmp/preview.json
          grep '"suppliersContacted":0' /tmp/preview.json

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"

          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1440,1200 --dump-dom 'http://127.0.0.1:3000/#app/conversations' > /tmp/vendor-scout-conversations-desktop.html
          grep '<section class="view active" id="view-conversations">' /tmp/vendor-scout-conversations-desktop.html
          grep '<h1 id="page-title">Conversations</h1>' /tmp/vendor-scout-conversations-desktop.html
          grep 'Controlled preview — no email sent' /tmp/vendor-scout-conversations-desktop.html
          grep 'preview only · no external message was sent' /tmp/vendor-scout-conversations-desktop.html
          grep 'View RFQ' /tmp/vendor-scout-conversations-desktop.html
          grep 'No supplier reply recorded yet' /tmp/vendor-scout-conversations-desktop.html
          if grep -q "Cannot set properties of null" /tmp/vendor-scout-conversations-desktop.html; then
            echo "Conversation render crashed"
            exit 1
          fi
          if grep -q 'id="workspace-error"[^>]*>[^<]' /tmp/vendor-scout-conversations-desktop.html; then
            echo "Workspace error is visible"
            exit 1
          fi

          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=1440,1200 --screenshot=/tmp/vendor-scout-conversations-desktop.png 'http://127.0.0.1:3000/#app/conversations'
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3500 --window-size=390,844 --screenshot=/tmp/vendor-scout-conversations-mobile.png 'http://127.0.0.1:3000/#app/conversations'

      - name: Upload outreach browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: vendor-scout-outreach-browser
          path: |
            /tmp/vendor-scout-conversations-desktop.png
            /tmp/vendor-scout-conversations-mobile.png
            /tmp/vendor-scout-conversations-desktop.html
            /tmp/prepare.json
            /tmp/preview.json
