name: Integrated Qodo Follow-up

on:
  push:
    branches:
      - build/final-product-copy2
    paths:
      - .github/integrated-qodo-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/final-product-copy2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply integrated review fixes
        run: python scripts/apply_integrated_qodo_followup.py
      - name: Install
        run: npm ci
      - name: Validate full suite
        run: npm run check
      - name: Commit only after validation
        run: |
          git config user.name "vendor-scout-remediation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/apply_integrated_qodo_followup.py .github/workflows/integrated-qodo-followup.yml .github/integrated-qodo-trigger.txt
          git add lib/negotiation.mjs lib/mcp.mjs lib/outreach.mjs lib/trueforge.mjs test/qodo-stack-regressions.test.mjs
          git commit -m "fix integrated Qodo review findings"
          git push origin HEAD:build/final-product-copy2
