name: Apply Stacked Qodo Fixes

on:
  push:
    branches: ["build/final-product-copy2"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/final-product-copy2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair generated timestamp validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-stacked-qodo-fixes.mjs')
          source = path.read_text()
          source = source.replace('throw new Error(\\`${field} must be a valid ISO timestamp or null\\`)', 'throw new Error(field + " must be a valid ISO timestamp or null")')
          path.write_text(source)
          PY
      - name: Apply stacked review fixes
        run: node scripts/apply-stacked-qodo-fixes.mjs
      - name: Preserve final provenance-backed FX architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/negotiation.mjs')
          source = path.read_text()
          before = '''  if (!offer.currency) missingFields.push("currency");
  else if (offer.currency !== targetCurrency) gaps.push({ field: "currency", priority: "high", offered: offer.currency, target: targetCurrency, reason: `pricing currency is not comparable to mission target currency ${targetCurrency}` });
  if (!Number.isFinite(price.value)) missingFields.push("unitPrice");
'''
          after = '''  const requiresFx = Boolean(offer.currency && offer.currency !== targetCurrency);
  if (!offer.currency) missingFields.push("currency");
  if (!Number.isFinite(price.value)) missingFields.push("unitPrice");
'''
          if before not in source:
              raise SystemExit('currency compatibility anchor missing')
          source = source.replace(before, after, 1)
          before = '''    competitorBenchmark: benchmark,
    effectiveUnitPrice: price.value,
    priceBasis: price.basis,
    priceTier: price.tier,
    gaps,
'''
          after = '''    competitorBenchmark: benchmark,
    effectiveUnitPrice: price.value,
    priceBasis: price.basis,
    priceTier: price.tier,
    requiresFx,
    priceComparable: Boolean(offer.currency) && !requiresFx,
    gaps,
'''
          if before not in source:
              raise SystemExit('evaluation metadata anchor missing')
          source = source.replace(before, after, 1)
          path.write_text(source)
          PY
      - name: Validate full suite
        run: npm run check
      - name: Commit validated remediation
        run: |
          rm scripts/apply-stacked-qodo-fixes.mjs .github/workflows/apply-stacked-qodo-fixes.yml docs/STACKED_QODO_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix remaining Qodo review findings"
          git push origin HEAD:build/final-product-copy2
