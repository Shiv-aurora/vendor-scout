name: Apply Stacked Qodo Fixes

on:
  push:
    branches: ["build/final-product-copy2"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/final-product-copy2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply stacked review fixes
        run: node scripts/apply-stacked-qodo-fixes.mjs
      - name: Validate full suite
        run: npm run check
      - name: Commit validated remediation
        run: |
          rm scripts/apply-stacked-qodo-fixes.mjs .github/workflows/apply-stacked-qodo-fixes.yml docs/STACKED_QODO_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix remaining Qodo review findings"
          git push origin HEAD:build/final-product-copy2
