name: One-shot polish final story

on:
  push:
    branches: ["build/final-product-copy2"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/polish_final_story.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/polish_final_story.py .github/workflows/one-shot-polish-final-story.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'polish final decision hierarchy and product story'
          git push origin HEAD:build/final-product-copy2
