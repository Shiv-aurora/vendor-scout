name: One-shot Phase 8 contract cleanup

on:
  push:
    branches: ["build/quote-comparison"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/quote-comparison
      - name: Tighten quote analysis idempotency and MCP contract tests
        run: python scripts/phase8_contract_cleanup.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs test/mcp-runtime.test.mjs .github/workflows/one-shot-phase8-contract-cleanup.yml scripts/phase8_contract_cleanup.py
          git commit -m "tighten quote analysis idempotency contract"
          git push origin HEAD:build/quote-comparison
