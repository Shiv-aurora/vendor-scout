name: One-shot Phase 8 quote runtime

on:
  push:
    branches: ["build/quote-comparison"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/quote-comparison
      - name: Wire persisted quote analysis runtime
        run: python scripts/phase8_runtime_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs .github/workflows/one-shot-phase8-runtime.yml scripts/phase8_runtime_patch.py
          git commit -m "wire deterministic quote analysis runtime"
          git push origin HEAD:build/quote-comparison
