name: One-shot Phase 8 quote revalidation

on:
  push:
    branches: ["build/quote-comparison"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/quote-comparison
      - name: Revalidate latest offers before ranking
        run: python scripts/phase8_quote_revalidation_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/quotes.mjs .github/workflows/one-shot-phase8-quote-revalidation.yml scripts/phase8_quote_revalidation_patch.py
          git commit -m "revalidate current offers before quote ranking"
          git push origin HEAD:build/quote-comparison
