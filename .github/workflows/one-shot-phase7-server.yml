name: One-shot Phase 7 server integration

on:
  push:
    branches: ["build/autonomous-negotiation"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/autonomous-negotiation
      - name: Wire persisted negotiation runtime
        run: python scripts/phase7_server_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs .github/workflows/one-shot-phase7-server.yml scripts/phase7_server_patch.py
          git commit -m "wire evidence-backed negotiation runtime"
          git push origin HEAD:build/autonomous-negotiation
